name: BuildBoost

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Check for new boost version
        id: check
        run: |
          LATEST=$(curl -sL https://api.github.com/repos/boostorg/boost/releases/latest | jq -r '.tag_name')
          VERSION=${LATEST#boost-}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "Boost version: $VERSION"

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: test-job
            os: ubuntu-latest
            compiler: gcc
            arch: x86_64
            ext: tar.xz
    runs-on: ${{ matrix.os }}
    env:
      BOOST_VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Test heredoc
        run: |
          cat > toolchain.cmake << 'TOOLCHAIN_EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(CMAKE_C_COMPILER aarch64-linux-gnu-gcc)
          set(CMAKE_CXX_COMPILER aarch64-linux-gnu-g++)
          TOOLCHAIN_EOF
          cat toolchain.cmake

      - name: Test pwsh
        if: false
        run: |
          Write-Host "Testing pwsh"
          7z a -tzip -mx9 "test.zip" "some-files\*"
        shell: pwsh