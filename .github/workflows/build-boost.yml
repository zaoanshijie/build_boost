name: BuildBoost

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Check for new boost version
        id: check
        run: |
          LATEST=$(curl -sL https://api.github.com/repos/boostorg/boost/releases/latest | jq -r '.tag_name')
          VERSION=${LATEST#boost-}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "Boost version: $VERSION"

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc-x86_64
            os: ubuntu-latest
            compiler: gcc
            arch: x86_64
            ext: tar.xz
    runs-on: ${{ matrix.os }}
    env:
      BOOST_VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Download boost source
        run: |
          echo "Downloading boost $BOOST_VERSION"
          curl -sL -o boost-src.tar.xz "https://github.com/boostorg/boost/releases/download/boost-$BOOST_VERSION/boost-$BOOST_VERSION-cmake.tar.xz"
          tar xf boost-src.tar.xz
          echo "BOOST_SRC=$PWD/boost-$BOOST_VERSION" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          mkdir -p boost-build
          cd boost-build
          CC=gcc CXX=g++ cmake "$BOOST_SRC" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX="$PWD/../boost-install"

      - name: Build
        run: cmake --build boost-build --parallel

      - name: Install
        run: cmake --install boost-build --prefix boost-install

      - name: Package
        run: |
          tar -cJf "boost-$BOOST_VERSION-${{ matrix.name }}-static.tar.xz" -C boost-install .

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: boost-${{ env.BOOST_VERSION }}-${{ matrix.name }}-static
          path: boost-${{ env.BOOST_VERSION }}-${{ matrix.name }}-static.tar.xz
          if-no-files-found: error

  release:
    needs: [check, build]
    if: always() && needs.check.result == 'success' && (needs.check.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create release
        env:
          BOOST_VERSION: ${{ needs.check.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "boost-$BOOST_VERSION" \
            --title "boost-$BOOST_VERSION" \
            --notes "Prebuilt static boost $BOOST_VERSION" \
            artifacts/*