name: BuildBoost

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Check for new boost version
        id: check
        run: |
          LATEST=$(curl -sL https://api.github.com/repos/boostorg/boost/releases/latest | jq -r '.tag_name')
          VERSION=${LATEST#boost-}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          RELEASE_EXISTS=$(curl -sL -o /dev/null -w '%{http_code}' \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$LATEST")
          if [ "$RELEASE_EXISTS" = "200" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Release $LATEST already exists"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "New boost version: $VERSION"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc-x86_64
            os: windows-latest
            compiler: msvc
            arch: x86_64
            ext: zip
          - name: windows-llvm-mingw-x86_64
            os: ubuntu-latest
            compiler: llvm-mingw
            arch: x86_64
            ext: tar.xz
          - name: linux-gcc-x86_64
            os: ubuntu-latest
            compiler: gcc
            arch: x86_64
            ext: tar.xz
          - name: linux-gcc-arm64
            os: ubuntu-latest
            compiler: gcc
            arch: aarch64
            ext: tar.xz
          - name: linux-llvm-x86_64
            os: ubuntu-latest
            compiler: llvm
            arch: x86_64
            ext: tar.xz
          - name: linux-llvm-arm64
            os: ubuntu-latest
            compiler: llvm
            arch: aarch64
            ext: tar.xz
    runs-on: ${{ matrix.os }}
    env:
      BOOST_VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Setup MSVC (Windows)
        if: matrix.compiler == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install tools (Linux GCC ARM64)
        if: matrix.compiler == 'gcc' && matrix.arch == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross libstdc++-13-dev-arm64-cross

      - name: Install tools (Linux LLVM ARM64)
        if: matrix.compiler == 'llvm' && matrix.arch == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld ninja-build libc6-dev-arm64-cross libstdc++-13-dev-arm64-cross

      - name: Install tools (Linux LLVM x86_64)
        if: matrix.compiler == 'llvm' && matrix.arch == 'x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build

      - name: Install tools (Linux GCC x86_64)
        if: matrix.compiler == 'gcc' && matrix.arch == 'x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Setup llvm-mingw
        if: matrix.compiler == 'llvm-mingw'
        run: |
          LLVM_MINGW_VER=$(curl -sL https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest | jq -r '.tag_name')
          curl -sL -o llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VER}/llvm-mingw-${LLVM_MINGW_VER}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          tar xf llvm-mingw.tar.xz
          echo "$PWD/llvm-mingw-${LLVM_MINGW_VER}-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Download boost source (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Write-Host "Downloading boost $env:BOOST_VERSION"
          curl.exe -sL -o boost-src.zip "https://github.com/boostorg/boost/releases/download/boost-$env:BOOST_VERSION/boost-$env:BOOST_VERSION-cmake.zip"
          Expand-Archive -Path boost-src.zip -DestinationPath .
          $srcDir = Get-ChildItem -Directory -Filter "boost-*" | Select-Object -First 1
          echo "BOOST_SRC=$($srcDir.FullName)" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Download boost source (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "Downloading boost $BOOST_VERSION"
          curl -sL -o boost-src.tar.xz "https://github.com/boostorg/boost/releases/download/boost-$BOOST_VERSION/boost-$BOOST_VERSION-cmake.tar.xz"
          tar xf boost-src.tar.xz
          echo "BOOST_SRC=$PWD/boost-$BOOST_VERSION" >> "$GITHUB_ENV"

      - name: Configure (MSVC)
        if: matrix.compiler == 'msvc'
        run: |
          New-Item -ItemType Directory -Force -Path boost-build | Out-Null
          Set-Location boost-build
          cmake $env:BOOST_SRC -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF "-DCMAKE_INSTALL_PREFIX=../boost-install"
          Set-Location ..
        shell: pwsh

      - name: Configure (Linux native)
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x86_64' && matrix.compiler != 'llvm-mingw'
        run: |
          mkdir -p boost-build
          cd boost-build
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            CC=gcc CXX=g++ cmake "$BOOST_SRC" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX="$PWD/../boost-install"
          else
            CC=clang CXX=clang++ cmake "$BOOST_SRC" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX="$PWD/../boost-install"
          fi

      - name: Configure (GCC ARM64)
        if: matrix.compiler == 'gcc' && matrix.arch == 'aarch64'
        run: |
          mkdir -p boost-build
          cd boost-build
          cat > toolchain.cmake << 'TOOLCHAIN_EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(CMAKE_C_COMPILER aarch64-linux-gnu-gcc)
          set(CMAKE_CXX_COMPILER aarch64-linux-gnu-g++)
          set(CMAKE_SYSROOT /usr/aarch64-linux-gnu)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          TOOLCHAIN_EOF
          cmake "$BOOST_SRC" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_TOOLCHAIN_FILE=toolchain.cmake -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY -DCMAKE_INSTALL_PREFIX="$PWD/../boost-install"

      - name: Configure (LLVM ARM64)
        if: matrix.compiler == 'llvm' && matrix.arch == 'aarch64'
        run: |
          mkdir -p boost-build
          cd boost-build
          cmake "$BOOST_SRC" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER_TARGET=aarch64-linux-gnu -DCMAKE_CXX_COMPILER_TARGET=aarch64-linux-gnu -DCMAKE_C_FLAGS="--sysroot=/usr/aarch64-linux-gnu" -DCMAKE_CXX_FLAGS="--sysroot=/usr/aarch64-linux-gnu" -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld" -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY -DCMAKE_INSTALL_PREFIX="$PWD/../boost-install"

      - name: Configure (llvm-mingw)
        if: matrix.compiler == 'llvm-mingw'
        run: |
          mkdir -p boost-build
          cd boost-build
          cat > toolchain.cmake << 'TOOLCHAIN_EOF'
          set(CMAKE_SYSTEM_NAME Windows)
          set(CMAKE_SYSTEM_PROCESSOR x86_64)
          set(CMAKE_C_COMPILER x86_64-w64-mingw32-clang)
          set(CMAKE_CXX_COMPILER x86_64-w64-mingw32-clang++)
          set(CMAKE_RC_COMPILER x86_64-w64-mingw32-windres)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          TOOLCHAIN_EOF
          cmake "$BOOST_SRC" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_CXX_FLAGS="-D_WIN32_WINNT=0x0A00" -DCMAKE_TOOLCHAIN_FILE=toolchain.cmake -DCMAKE_INSTALL_PREFIX="$PWD/../boost-install"

      - name: Build
        run: cmake --build boost-build --config Release --parallel
        shell: bash

      - name: Install
        run: cmake --install boost-build --config Release --prefix boost-install
        shell: bash

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          7z a -tzip -mx9 "boost-$env:BOOST_VERSION-${{ matrix.name }}-static.zip" boost-install\*
        shell: pwsh

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          tar -cJf "boost-$BOOST_VERSION-${{ matrix.name }}-static.tar.xz" -C boost-install .
        shell: bash

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: boost-${{ env.BOOST_VERSION }}-${{ matrix.name }}-static
          path: |
            boost-${{ env.BOOST_VERSION }}-${{ matrix.name }}-static.zip
            boost-${{ env.BOOST_VERSION }}-${{ matrix.name }}-static.tar.xz
          if-no-files-found: error

  release:
    needs: [check, build]
    if: always() && needs.check.result == 'success' && (needs.check.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create release
        env:
          BOOST_VERSION: ${{ needs.check.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "boost-$BOOST_VERSION" \
            --title "boost-$BOOST_VERSION" \
            --notes "Prebuilt static boost $BOOST_VERSION.

          | Platform | Compiler | Architecture |
          |----------|----------|-------------|
          | Windows | MSVC | x86_64 |
          | Windows | llvm-mingw | x86_64 |
          | Linux | GCC | x86_64 |
          | Linux | GCC | ARM64 |
          | Linux | LLVM | x86_64 |
          | Linux | LLVM | ARM64 |" \
            artifacts/*